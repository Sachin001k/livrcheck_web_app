# Keeps the free-tier Supabase project awake.
# Supabase pauses free projects after 7 days without activity; while paused,
# the website can't log people in or save their health checks. This job
# makes a small real database query every 2 days so that never happens.
#
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions →
# New repository secret:
#   SUPABASE_URL       = the NEXT_PUBLIC_SUPABASE_URL value from .env.local
#   SUPABASE_ANON_KEY  = the NEXT_PUBLIC_SUPABASE_ANON_KEY value (never the service_role key)
#
# If a run fails, GitHub emails the repo owner, so a paused or broken project
# gets noticed. Run it by hand from the Actions tab ("Run workflow").
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */2 * *" # every 2 days at 03:17 UTC (08:47 IST)
  workflow_dispatch:

permissions:
  contents: read
  actions: write # only to re-enable this workflow (see the last step)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # A read through the REST API reaches Postgres (row-level security
          # returns an empty list to anonymous callers, which is fine).
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Supabase is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Supabase did not answer (HTTP $code). It may be paused: restore it in the Supabase dashboard."
          exit 1

      # GitHub turns off scheduled workflows in a public repo after 60 days
      # without commits. Re-enabling this workflow each run resets that timer,
      # so the keep-alive keeps running even when nobody pushes code.
      - name: Keep this schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable" || echo "::warning::Could not refresh the schedule timer."
